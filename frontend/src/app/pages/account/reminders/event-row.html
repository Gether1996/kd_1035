@let r = t();
@let id = event().id;

<app-reminder-picker [event]="event()" [describedBy]="'event-' + id">
  <div class="event__info">
    <h3 class="event__name" [id]="'event-' + id">{{ name() }}</h3>
    @if (event().next_start) {
      <p class="event__when">
        <time [attr.datetime]="event().next_start">{{ when() }}</time>
        <span>UTC {{ utc() }}</span>
      </p>
    } @else {
      <p class="event__when">{{ r.notPlanned }}</p>
    }
    <p class="event__repeat">{{ repeat() }}</p>
  </div>
</app-reminder-picker>
