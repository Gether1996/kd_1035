@let k = t();
<section class="panel" aria-labelledby="kvk-heading-title">
  <h2 class="panel__title panel__title--small" id="kvk-heading-title">{{ k.headingTitle }}</h2>
  <p class="panel__lead">{{ k.headingLead }}</p>

  <form class="form form--inline" (submit)="save($event)">
    <div class="field">
      <label class="field__label" for="kvk-title-sk">{{ k.titleSk }}</label>
      <input
        #sk
        id="kvk-title-sk"
        class="input"
        type="text"
        maxlength="80"
        [placeholder]="k.titlePlaceholder"
        [value]="titleSk()"
        (input)="titleSk.set(sk.value)"
      />
    </div>
    <div class="field">
      <label class="field__label" for="kvk-title-cs">{{ k.titleCs }}</label>
      <input #cs id="kvk-title-cs" class="input" type="text" maxlength="80" [value]="titleCs()" (input)="titleCs.set(cs.value)" />
    </div>
    <button type="submit" class="pill-btn" [attr.aria-disabled]="busy() || null">{{ k.save }}</button>
  </form>
  <p class="form__state" role="status" [class.is-error]="state() === 'failed'">
    @if (state() === 'saved') {
      {{ k.saved }}
    } @else if (state() === 'failed') {
      {{ k.errors.failed }}
    }
  </p>
</section>

<section class="panel" aria-labelledby="kvk-reviewers-title">
  <h2 class="panel__title panel__title--small" id="kvk-reviewers-title">{{ k.reviewersTitle }}</h2>
  <p class="panel__lead">{{ k.reviewersLead }}</p>
  <a class="pill-btn pill-btn--quiet reviewers__link" [routerLink]="i18n.path('account')" fragment="hraci">
    {{ k.reviewersLink }}<svg appIcon="arrow-right"></svg>
  </a>
</section>
