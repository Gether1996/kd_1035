# Local development with hot reload:
#   docker compose -f docker-compose.dev.yml up --build
#   frontend → http://localhost:4200   admin → http://localhost:8000/admin/
name: kd1035-dev

# same log limits as production: at most 3 × 10 MB per container
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: ./backend
    logging: *logging
    env_file: .env
    environment:
      DJANGO_DEBUG: "1"
    command: python manage.py runserver 0.0.0.0:8000
    user: root
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    logging: *logging
    env_file: .env
    environment:
      DJANGO_DEBUG: "1"
      BACKUP_DIR: /backups
    entrypoint: []
    command: python manage.py run_worker
    user: root
    volumes:
      - ./backend:/app
      # same volume as backend: the admin overview reads the worker's heartbeat /app/data/worker_status.json
      - backend_data:/app/data
      - ./backups:/backups
    depends_on:
      - backend

  frontend:
    image: node:24-alpine
    logging: *logging
    working_dir: /app
    environment:
      API_TARGET: http://backend:8000
    command: sh -c "npm install --no-audit --no-fund && npx ng serve --host 0.0.0.0 --poll 1000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  backend_data:
  frontend_node_modules:
