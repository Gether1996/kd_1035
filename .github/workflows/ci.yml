# Every pull request and every push to main: backend and frontend tests, the production build, and the end-to-end
# suite (tools/e2e) against the production stack (docker-compose.yml) on a fresh database. A merge to main goes live,
# so main is only merged green – docs/qa.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13' # backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # the admin pages need whitenoise's manifest, which the Docker image builds in backend/Dockerfile
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test
      - name: No model change without its migration
        run: python manage.py makemigrations --check --dry-run

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - name: Production build (prerender + bundle budget)
        run: npx ng build

  e2e:
    name: E2E on the production stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Throwaway .env
        # nothing real: a random key, login switched on with a made-up Discord app (the tests sign in through
        # manage.py test_session and never go to Discord), no webhook, no bot
        run: |
          cat > .env <<EOF
          DJANGO_SECRET_KEY=ci-$(openssl rand -hex 32)
          DJANGO_DEBUG=0
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:9005
          DJANGO_SECURE_COOKIES=0
          DJANGO_NUM_PROXIES=1
          DJANGO_SUPERUSER_USERNAME=admin
          DJANGO_SUPERUSER_EMAIL=admin@example.com
          DJANGO_SUPERUSER_PASSWORD=ci-$(openssl rand -hex 16)
          SITE_URL=http://localhost:9005
          WEB_PORT=9005
          WEB_BIND=127.0.0.1
          DISCORD_CLIENT_ID=ci-not-a-real-app
          DISCORD_CLIENT_SECRET=ci-not-a-secret
          BACKUP_PATH=./backups
          EOF

      - name: Start the production stack
        run: |
          docker compose up -d --build
          for i in $(seq 90); do
            curl -fsS -o /dev/null http://localhost:9005/ && curl -fsS -o /dev/null http://localhost:9005/api/guides/ && exit 0
            sleep 2
          done
          docker compose ps; docker compose logs --tail=100; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/e2e/package-lock.json
      - name: Install Playwright
        working-directory: tools/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: Test player
        run: echo "SESSION=$(docker compose exec -T -u app backend python manage.py test_session --marches | tr -d '\r')" >> "$GITHUB_ENV"

      - name: Playwright – every page, device and journey
        working-directory: tools/e2e
        env:
          BASE_URL: http://localhost:9005
          PROD: '1'
        run: npx playwright test

      - name: Summary
        if: always()
        working-directory: tools/e2e
        run: |
          { echo '```'; node summary.mjs out/run.json --warnings; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Server logs
        if: failure()
        run: docker compose logs --tail=200 backend web worker

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tools/e2e/out/report
            tools/e2e/out/results
          retention-days: 14
