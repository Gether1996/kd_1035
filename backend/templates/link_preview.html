<!doctype html>{# Open Graph page for Discord, Facebook and other bots without JavaScript: guides.views.link_preview, kingdom.preview.event_preview #}
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ description }}">
  <meta name="robots" content="noindex">
  {% if canonical %}<link rel="canonical" href="{{ canonical }}">{% endif %}
  <meta name="theme-color" content="#f5c451">
  <meta property="og:type" content="{{ og_type }}">
  <meta property="og:site_name" content="Kingdom 1035">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ url }}">
  <meta property="og:image" content="{{ image }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="{{ locale }}">
  <meta property="og:locale:alternate" content="{{ locale_alternate }}">
  {% if modified %}<meta property="article:modified_time" content="{{ modified|date:'c' }}">{% endif %}
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <h1>{{ title }}</h1>
  <p>{{ description }}</p>
  <p><a href="{{ url }}">{{ url }}</a></p>
</body>
</html>
